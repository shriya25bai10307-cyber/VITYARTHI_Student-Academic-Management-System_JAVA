<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Academic Record</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 30px 60px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            color: #d1d5db;
        }

        .container {
            padding: 40px 60px;
        }

        .card {
            background: white;
            max-width: 700px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            margin: auto;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            margin-top: 25px;
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 18px;
            background: #374151;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back:hover {
            background: #1f2937;
        }
    </style>
</head>

<body>

<header>
    <h1>Add Academic Record</h1>
    <p>Add subject marks and attendance</p>
</header>

<div class="container">

    <div class="card">

        <h2>Academic Information</h2>

        <!-- Error Message -->

        <div th:if="${error}"
             class="error"
             th:text="${error}">
            Error message
        </div>

        <form action="/academic/add" method="post">

            <label>Student</label>

            <select name="registrationNumber" required>

                <option value="">
                    Select Student
                </option>

                <option th:each="student : ${students}"
                        th:value="${student.registrationNumber}"
                        th:text="${student.registrationNumber + ' - ' + student.name}">
                    REG001 - Student Name
                </option>

            </select>

            <label>Subject Code</label>

            <input type="text"
                   name="subjectCode"
                   placeholder="Example: CSE101"
                   required>

            <label>Subject Name</label>

            <input type="text"
                   name="subjectName"
                   placeholder="Example: Programming in Java"
                   required>

            <label>Credits</label>

            <input type="number"
                   name="credits"
                   min="1"
                   required>

            <label>Marks</label>

            <input type="number"
                   name="marks"
                   min="0"
                   max="100"
                   step="0.01"
                   placeholder="0 - 100"
                   required>

            <label>Attendance (%)</label>

            <input type="number"
                   name="attendance"
                   min="0"
                   max="100"
                   step="0.01"
                   placeholder="0 - 100"
                   required>

            <button type="submit">
                Add Academic Record
            </button>

        </form>

        <a href="/academic" class="back">
            ← Back to Academic Records
        </a>

    </div>

</div>

</body>
</html>

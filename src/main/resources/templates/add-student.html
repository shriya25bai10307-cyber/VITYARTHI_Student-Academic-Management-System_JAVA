<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Student</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 30px 60px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin-top: 8px;
            color: #d1d5db;
        }

        .container {
            padding: 40px 60px;
        }

        .card {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .buttons {
            margin-top: 25px;
        }

        button {
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-left: 10px;
            padding: 11px 18px;
            background: #374151;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<header>
    <h1>Student Management</h1>
    <p>Add a new student to the academic management system</p>
</header>

<div class="container">

    <div class="card">

        <h2>Add Student</h2>

        <form action="/students/add" method="post">

            <div class="form-group">
                <label>Registration Number</label>
                <input type="text"
                       name="registrationNumber"
                       placeholder="Enter registration number"
                       required>
            </div>

            <div class="form-group">
                <label>Student Name</label>
                <input type="text"
                       name="name"
                       placeholder="Enter student name"
                       required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email"
                       name="email"
                       placeholder="Enter email address"
                       required>
            </div>

            <div class="form-group">
                <label>Program</label>
                <input type="text"
                       name="program"
                       placeholder="Example: B.Tech AI/ML"
                       required>
            </div>

            <div class="form-group">
                <label>Semester</label>
                <input type="number"
                       name="semester"
                       min="1"
                       max="8"
                       placeholder="Enter semester"
                       required>
            </div>

            <div class="buttons">
                <button type="submit">Add Student</button>

                <a href="/students" class="back">
                    Cancel
                </a>
            </div>

        </form>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 30px 60px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            color: #d1d5db;
        }

        .container {
            padding: 40px 60px;
        }

        .card {
            background: white;
            max-width: 700px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin: auto;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            margin-top: 25px;
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 18px;
            background: #374151;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<header>
    <h1>Edit Student</h1>
    <p>Update student information</p>
</header>

<div class="container">

    <div class="card">

        <h2>Student Information</h2>

        <form action="/students/edit" method="post">

            <label>Registration Number</label>

            <input type="text"
                   name="registrationNumber"
                   th:value="${student.registrationNumber}"
                   readonly>


            <label>Name</label>

            <input type="text"
                   name="name"
                   th:value="${student.name}"
                   required>


            <label>Email</label>

            <input type="email"
                   name="email"
                   th:value="${student.email}"
                   required>


            <label>Program</label>

            <input type="text"
                   name="program"
                   th:value="${student.program}"
                   required>


            <label>Semester</label>

            <input type="number"
                   name="semester"
                   min="1"
                   max="8"
                   th:value="${student.semester}"
                   required>


            <button type="submit">
                Update Student
            </button>

        </form>

        <a href="/students" class="back">
            ← Back to Students
        </a>

    </div>

</div>

</body>
</html>
